<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syntex - Agentic API Assistant</title>
    <!-- load tailwind css for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 h-screen flex flex-col font-sans">
    
    <!-- header -->
    <header class="bg-gray-800 p-4 border-b border-gray-700 shadow-md">
        <h1 class="text-xl font-bold text-blue-400">Syntex Workspace</h1>
    </header>

    <!-- main layout -->
    <div class="flex-1 flex overflow-hidden">
        
        <!-- reasoning trace sidebar -->
        <aside class="w-1/3 bg-gray-800 border-r border-gray-700 flex flex-col">
            <div class="p-4 bg-gray-900 border-b border-gray-700 font-semibold text-gray-300">
                Agent Trace
            </div>
            <div id="trace-container" class="flex-1 p-4 overflow-y-auto space-y-3 text-sm">
                <!-- agent messages will stream here -->
                <div class="text-gray-500 italic">system ready. waiting for query...</div>
            </div>
        </aside>

        <!-- main code area -->
        <main class="flex-1 flex flex-col bg-gray-900">
            <div class="flex-1 p-6 overflow-y-auto" id="code-container">
                <!-- final code will render here -->
                <pre class="bg-gray-800 p-4 rounded-lg text-gray-300 shadow-inner overflow-x-auto"><code id="code-output">// generated code will appear here</code></pre>
            </div>

            <!-- input area -->
            <div class="p-4 bg-gray-800 border-t border-gray-700">
                <form id="query-form" class="flex gap-2">
                    <input type="text" id="query-input" class="flex-1 bg-gray-700 text-white rounded px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Ask Syntex to write an API integration..." required>
                    <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-2 rounded font-semibold transition-colors">Generate</button>
                </form>
            </div>
        </main>
    </div>

    <!-- load application logic -->
    <script src="/static/app.js"></script>
</body>
</html>
